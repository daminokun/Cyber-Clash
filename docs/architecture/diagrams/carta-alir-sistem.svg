<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .terminator { fill: #e2e8f0; stroke: #1e293b; stroke-width: 3; }
      .io { fill: #e0f2fe; stroke: #0369a1; stroke-width: 3; }
      .process { fill: #f8fafc; stroke: #334155; stroke-width: 3; }
      .server { fill: #f1f5f9; stroke: #0f172a; stroke-width: 3; }
      .hacker { fill: #fef2f2; stroke: #b91c1c; stroke-width: 3; }
      .target { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 3; }
      .decision { fill: #fefce8; stroke: #a16207; stroke-width: 3; }
      .win { fill: #f0fdf4; stroke: #15803d; stroke-width: 3; }
      .line { fill: none; stroke: #334155; stroke-width: 3; }
      .line-dash { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 7,5; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .text-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .text-small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #334155; text-anchor: middle; dominant-baseline: central; }
      .text-left { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; fill: #0f172a; text-anchor: start; dominant-baseline: central; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #334155; text-anchor: middle; }
      .label-bg { fill: #ffffff; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" class="bg" />

  
  <text x="800" y="42" class="title">CARTA ALIR SISTEM PERMAINAN CYBER CLASH</text>

  
  
  <line x1="160" y1="165" x2="205" y2="165" class="line" marker-end="url(#arrow)" />

  
  <line x1="365" y1="165" x2="435" y2="165" class="line" marker-end="url(#arrow)" />
  
  <line x1="285" y1="225" x2="285" y2="280" class="line" marker-end="url(#arrow)" />

  
  <line x1="655" y1="165" x2="710" y2="165" class="line" marker-end="url(#arrow)" />
  
  <line x1="940" y1="165" x2="995" y2="165" class="line" marker-end="url(#arrow)" />

  
  <polyline points="1075,105 1075,70 545,70 545,125" class="line" marker-end="url(#arrow)" />

  
  <polyline points="1075,225 1075,260 660,260 660,280" class="line" marker-end="url(#arrow)" />
  
  <line x1="400" y1="320" x2="495" y2="320" class="line" marker-end="url(#arrow)" />

  
  <line x1="820" y1="320" x2="885" y2="320" class="line" marker-end="url(#arrow)" />

  
  <line x1="1125" y1="320" x2="1195" y2="320" class="line" marker-end="url(#arrow)" />

  
  <line x1="1355" y1="320" x2="1400" y2="320" class="line" marker-end="url(#arrow)" />
  
  <polyline points="1485,365 1485,680 1200,680" class="line" marker-end="url(#arrow)" />

  
  <line x1="1275" y1="380" x2="1275" y2="415" class="line" />
  <polyline points="1275,415 240,415 240,440" class="line" marker-end="url(#arrow)" />
  <polyline points="1275,415 620,415 620,440" class="line" marker-end="url(#arrow)" />

  
  <polyline points="240,605 240,625 430,625 430,645" class="line" />
  <polyline points="620,605 620,625 430,625 430,645" class="line" marker-end="url(#arrow)" />

  
  <line x1="595" y1="680" x2="675" y2="680" class="line" marker-end="url(#arrow)" />

  
  <polyline points="765,615 765,415 1275,415" class="line" />

  
  <line x1="855" y1="680" x2="935" y2="680" class="line" marker-end="url(#arrow)" />

  
  <line x1="1065" y1="715" x2="1065" y2="765" class="line" marker-end="url(#arrow)" />

  
  <line x1="875" y1="805" x2="775" y2="805" class="line" marker-end="url(#arrow)" />

  
  <polyline points="525,805 40,805 40,385 660,385 660,365" class="line-dash" marker-end="url(#arrow)" />
  
  <line x1="650" y1="840" x2="650" y2="865" class="line" />
  <polyline points="650,865 360,865 360,835" class="line" marker-end="url(#arrow)" />


  

  
  
  <rect x="40" y="135" width="120" height="60" rx="30" ry="30" class="terminator" />
  <text x="100" y="165" class="text-bold">MULA</text>

  
  <polygon points="285,105 365,165 285,225 205,165" class="decision" />
  <text x="285" y="156" class="text-bold">Pilih Mod</text>
  <text x="285" y="176" class="text-bold">Permainan?</text>

  <rect x="372" y="142" width="56" height="20" class="label-bg" />
  <text x="400" y="156" class="label">PvP</text>
  <rect x="292" y="235" width="42" height="20" class="label-bg" />
  <text x="313" y="249" class="label">PvE</text>

  
  <polygon points="455,125 665,125 645,205 435,205" class="io" />
  <text x="550" y="155" class="text-bold">Masukkan Server IP</text>
  <text x="550" y="177" class="text-small">(127.0.0.1:8080)</text>

  
  <rect x="710" y="125" width="230" height="80" rx="8" ry="8" class="process" />
  <text x="825" y="155" class="text-bold">Sambung Client Godot</text>
  <text x="825" y="177" class="text-small">ke Server Node.js (WebSocket)</text>

  
  <polygon points="1075,105 1155,165 1075,225 995,165" class="decision" />
  <text x="1075" y="156" class="text-bold">2 Pemain</text>
  <text x="1075" y="176" class="text-bold">Sedia?</text>

  <rect x="780" y="58" width="50" height="20" class="label-bg" />
  <text x="805" y="72" class="label">Tidak</text>
  <rect x="1085" y="232" width="30" height="20" class="label-bg" />
  <text x="1100" y="246" class="label">Ya</text>


  
  
  <rect x="170" y="280" width="230" height="80" rx="8" ry="8" class="process" />
  <text x="285" y="310" class="text-bold">Sambung Server Lokal</text>
  <text x="285" y="332" class="text-small">&amp; Aktifkan Lawan AI Sistem</text>

  
  <rect x="495" y="280" width="325" height="80" rx="8" ry="8" class="server" />
  <text x="657" y="310" class="text-bold">Server Tetapkan Peranan Rawak</text>
  <text x="657" y="332" class="text-small">(Hacker vs Target) &amp; Profil Sasaran</text>

  
  <rect x="885" y="285" width="240" height="70" rx="8" ry="8" class="process" />
  <text x="1005" y="312" class="text-bold">Sesi Perlumbaan</text>
  <text x="1005" y="332" class="text-bold">Objektif Bermula</text>

  
  <polygon points="1275,260 1355,320 1275,380 1195,320" class="decision" />
  <text x="1275" y="311" class="text-bold">Pemain</text>
  <text x="1275" y="331" class="text-bold">Terputus?</text>

  <rect x="1362" y="297" width="30" height="20" class="label-bg" />
  <text x="1377" y="311" class="label">Ya</text>
  <rect x="1285" y="388" width="48" height="20" class="label-bg" />
  <text x="1309" y="402" class="label">Tidak</text>

  
  <rect x="1400" y="280" width="170" height="85" rx="8" ry="8" class="win" />
  <text x="1485" y="312" class="text-bold">Kemenangan</text>
  <text x="1485" y="334" class="text-small">Lalai Pemain Aktif</text>


  
  
  <rect x="65" y="440" width="350" height="165" rx="8" ry="8" class="hacker" />
  <text x="240" y="465" class="text-bold" style="fill:#991b1b;">Peranan: Hacker (5 Fasa Serangan)</text>
  <text x="85" y="495" class="text-left">1. Reconnaissance (Dossier Sasaran)</text>
  <text x="85" y="518" class="text-left">2. Scanning (Imbasan Rangkaian/Sosial)</text>
  <text x="85" y="541" class="text-left">3. Gaining Access (Modular Bait Builder)</text>
  <text x="85" y="564" class="text-left">4. Maintaining Access (Fast/Slow Exfil)</text>
  <text x="85" y="587" class="text-left">5. Covering Tracks (Padam Log &amp; Jejak)</text>

  
  <rect x="440" y="440" width="360" height="165" rx="8" ry="8" class="target" />
  <text x="620" y="465" class="text-bold" style="fill:#1e40af;">Peranan: Target (Pertahanan &amp; Tugas)</text>
  <text x="460" y="498" class="text-left">• Selesaikan 3 Tugasan Harian Sah</text>
  <text x="460" y="524" class="text-left">• Urus Notifikasi (Buka / Imbas / Sekat)</text>
  <text x="460" y="550" class="text-left">• Guna Tool Keselamatan (Kuota: 2x)</text>
  <text x="460" y="576" class="text-left">• Kawal Kesilapan (Had Maksimum: 3x)</text>

  
  <rect x="265" y="645" width="330" height="70" rx="8" ry="8" class="server" />
  <text x="430" y="670" class="text-bold">Server Autoritatif Sahkan Tindakan</text>
  <text x="430" y="692" class="text-small">&amp; Kemas Kini Status Aset/Tugas (JSON)</text>

  
  <polygon points="765,615 855,680 765,745 675,680" class="decision" />
  <text x="765" y="666" class="text-bold">Objektif</text>
  <text x="765" y="686" class="text-bold">Tercapai?</text>
  <text x="765" y="706" class="text-small">(3 Tugas/Exfil)</text>

  <rect x="775" y="510" width="48" height="20" class="label-bg" />
  <text x="799" y="524" class="label">Tidak</text>
  <rect x="875" y="657" width="30" height="20" class="label-bg" />
  <text x="890" y="671" class="label">Ya</text>

  
  <rect x="935" y="645" width="260" height="70" rx="8" ry="8" class="server" />
  <text x="1065" y="670" class="text-bold">Kira Skor (0 – 1000)</text>
  <text x="1065" y="692" class="text-small">&amp; Gred (S, A, B, C, F)</text>


  
  
  <polygon points="895,765 1255,765 1235,845 875,845" class="io" />
  <text x="1065" y="795" class="text-bold">Papar Skrin Keputusan, Skor, Gred</text>
  <text x="1065" y="817" class="text-small">&amp; Laporan Pasca-Perlawanan (Salin Laporan)</text>

  
  <rect x="525" y="770" width="250" height="70" rx="8" ry="8" class="process" />
  <text x="650" y="795" class="text-bold">Pilihan Selepas Tamat</text>
  <text x="650" y="817" class="text-small">(Main Semula / Menu Utama)</text>

  <rect x="150" y="782" width="110" height="20" class="label-bg" />
  <text x="205" y="796" class="label">Main Semula</text>
  <rect x="460" y="845" width="100" height="20" class="label-bg" />
  <text x="510" y="859" class="label">Menu Utama</text>

  
  <rect x="290" y="775" width="140" height="60" rx="30" ry="30" class="terminator" />
  <text x="360" y="805" class="text-bold">TAMAT</text>

</svg>