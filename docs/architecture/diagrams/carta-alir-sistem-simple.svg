<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .terminator { fill: #e2e8f0; stroke: #1e293b; stroke-width: 4; }
      .process { fill: #f8fafc; stroke: #334155; stroke-width: 4; }
      .server { fill: #f1f5f9; stroke: #0f172a; stroke-width: 4; }
      .hacker { fill: #fef2f2; stroke: #b91c1c; stroke-width: 4; }
      .target { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 4; }
      .decision { fill: #fefce8; stroke: #a16207; stroke-width: 4; }
      .io { fill: #e0f2fe; stroke: #0369a1; stroke-width: 4; }
      .line { fill: none; stroke: #334155; stroke-width: 4; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 32px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .text-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .text-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; fill: #334155; text-anchor: middle; dominant-baseline: central; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #334155; text-anchor: middle; }
      .label-bg { fill: #ffffff; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" class="bg" />

  
  <text x="800" y="55" class="title">ALIRAN UTAMA SISTEM CYBER CLASH</text>

  
  
  <line x1="250" y1="220" x2="340" y2="220" class="line" marker-end="url(#arrow)" />

  
  <line x1="760" y1="220" x2="860" y2="220" class="line" marker-end="url(#arrow)" />

  
  <polyline points="1130,285 1130,360 450,360 450,415" class="line" marker-end="url(#arrow)" />
  <polyline points="1130,285 1130,415" class="line" marker-end="url(#arrow)" />

  
  <polyline points="450,575 450,625 790,625" class="line" />
  <polyline points="1130,575 1130,625 790,625 790,675" class="line" marker-end="url(#arrow)" />

  
  <line x1="560" y1="740" x2="465" y2="740" class="line" marker-end="url(#arrow)" />

  
  <polyline points="205,740 80,740 80,495 215,495" class="line" marker-end="url(#arrow)" />

  
  <polyline points="335,830 335,865 1130,865 1130,815" class="line" marker-end="url(#arrow)" />

  
  <line x1="1330" y1="740" x2="1385" y2="740" class="line" marker-end="url(#arrow)" />


  

  
  
  <rect x="60" y="175" width="190" height="90" rx="45" ry="45" class="terminator" />
  <text x="155" y="220" class="text-bold">MULA</text>

  
  <rect x="340" y="155" width="420" height="130" rx="14" ry="14" class="process" />
  <text x="550" y="200" class="text-bold">1. Sambungan Client–Server</text>
  <text x="550" y="240" class="text-sub">Mod PvP / PvE via WebSocket</text>

  
  <rect x="860" y="155" width="540" height="130" rx="14" ry="14" class="server" />
  <text x="1130" y="200" class="text-bold">2. Penetapan Sesi Permainan</text>
  <text x="1130" y="240" class="text-sub">Peranan Rawak (Hacker vs Target) &amp; Profil</text>


  
  
  <rect x="220" y="415" width="460" height="160" rx="14" ry="14" class="hacker" />
  <text x="450" y="465" class="text-bold" style="fill:#991b1b;">3A. Tindakan Hacker</text>
  <text x="450" y="510" class="text-sub">5 Fasa Serangan &amp; Exfiltration</text>

  
  <rect x="900" y="415" width="460" height="160" rx="14" ry="14" class="target" />
  <text x="1130" y="465" class="text-bold" style="fill:#1e40af;">3B. Tindakan Target</text>
  <text x="1130" y="510" class="text-sub">3 Tugasan Harian &amp; Pertahanan</text>


  
  
  <rect x="560" y="675" width="460" height="130" rx="14" ry="14" class="server" />
  <text x="790" y="720" class="text-bold">4. Pengesahan Server</text>
  <text x="790" y="760" class="text-sub">Kemas Kini Status &amp; Rekod Aksi</text>

  
  <polygon points="335,650 465,740 335,830 205,740" class="decision" />
  <text x="335" y="725" class="text-bold">Objektif</text>
  <text x="335" y="758" class="text-bold">Tercapai?</text>

  <rect x="105" y="715" width="75" height="28" class="label-bg" />
  <text x="142" y="736" class="label">Tidak</text>
  <rect x="355" y="842" width="45" height="28" class="label-bg" />
  <text x="377" y="863" class="label">Ya</text>

  
  <polygon points="1030,675 1350,675 1320,805 1000,805" class="io" />
  <text x="1175" y="720" class="text-bold">5. Skor &amp; Laporan</text>
  <text x="1175" y="760" class="text-sub">Skor (0–1000) &amp; Gred</text>

  
  <rect x="1385" y="695" width="170" height="90" rx="45" ry="45" class="terminator" />
  <text x="1470" y="740" class="text-bold">TAMAT</text>

</svg>