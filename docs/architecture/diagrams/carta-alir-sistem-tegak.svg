<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1850" width="1100" height="1850">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .terminator { fill: #e2e8f0; stroke: #1e293b; stroke-width: 2.5; }
      .io { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2.5; }
      .process { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; }
      .server { fill: #f1f5f9; stroke: #0f172a; stroke-width: 2.5; }
      .hacker { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2.5; }
      .target { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.5; }
      .decision { fill: #fefce8; stroke: #a16207; stroke-width: 2.5; }
      .win { fill: #f0fdf4; stroke: #15803d; stroke-width: 2.5; }
      .line { fill: none; stroke: #334155; stroke-width: 2.5; }
      .line-dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6,4; }
      .text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .text-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .text-small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #334155; text-anchor: middle; dominant-baseline: central; }
      .text-left { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; fill: #0f172a; text-anchor: start; dominant-baseline: central; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #334155; text-anchor: middle; }
      .label-bg { fill: #ffffff; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  
  <rect width="1100" height="1850" class="bg" />

  
  
  <line x1="550" y1="75" x2="550" y2="115" class="line" marker-end="url(#arrow)" />
  
  <line x1="550" y1="175" x2="550" y2="215" class="line" marker-end="url(#arrow)" />

  
  <polyline points="455,275 300,275 300,335" class="line" marker-end="url(#arrow)" />
  
  <polyline points="645,275 800,275 800,335" class="line" marker-end="url(#arrow)" />

  
  <line x1="300" y1="405" x2="300" y2="445" class="line" marker-end="url(#arrow)" />
  
  <line x1="300" y1="515" x2="300" y2="555" class="line" marker-end="url(#arrow)" />

  
  <polyline points="205,615 110,615 110,370 185,370" class="line" marker-end="url(#arrow)" />

  
  <polyline points="300,675 300,720 550,720 550,745" class="line" marker-end="url(#arrow)" />
  
  <polyline points="800,405 800,720 550,720 550,745" class="line" marker-end="url(#arrow)" />

  
  <line x1="550" y1="815" x2="550" y2="855" class="line" marker-end="url(#arrow)" />
  
  <line x1="550" y1="905" x2="550" y2="945" class="line" marker-end="url(#arrow)" />

  
  <polyline points="650,1005 930,1005 930,1045" class="line" marker-end="url(#arrow)" />
  
  <polyline points="930,1115 930,1535 695,1535" class="line" marker-end="url(#arrow)" />

  
  <line x1="550" y1="1065" x2="550" y2="1100" class="line" />
  <polyline points="550,1100 320,1100 320,1135" class="line" marker-end="url(#arrow)" />
  <polyline points="550,1100 720,1100 720,1135" class="line" marker-end="url(#arrow)" />

  
  <polyline points="320,1275 320,1305 550,1305 550,1325" class="line" marker-end="url(#arrow)" />
  <polyline points="720,1275 720,1305 550,1305 550,1325" class="line" marker-end="url(#arrow)" />

  
  <line x1="550" y1="1385" x2="550" y2="1420" class="line" marker-end="url(#arrow)" />

  
  <polyline points="425,1485 110,1485 110,1005 445,1005" class="line" marker-end="url(#arrow)" />

  
  <line x1="550" y1="1550" x2="550" y2="1585" class="line" marker-end="url(#arrow)" />

  
  <line x1="550" y1="1645" x2="550" y2="1685" class="line" marker-end="url(#arrow)" />

  
  <line x1="550" y1="1745" x2="550" y2="1775" class="line" />

  
  <polyline points="440,1775 60,1775 60,780 395,780" class="line-dash" marker-end="url(#arrow)" />
  
  <polyline points="660,1775 780,1775 780,1795" class="line" marker-end="url(#arrow)" />


  

  
  <rect x="460" y="25" width="180" height="50" rx="25" ry="25" class="terminator" />
  <text x="550" y="50" class="text-bold">MULA</text>

  
  <polygon points="400,115 720,115 700,175 380,175" class="io" />
  <text x="550" y="137" class="text-bold">Pemain Membuka Aplikasi Web</text>
  <text x="550" y="157" class="text-small">Cyber Clash (Godot Client)</text>

  
  <polygon points="550,215 645,275 550,335 455,275" class="decision" />
  <text x="550" y="267" class="text-bold">Pilih Mod</text>
  <text x="550" y="285" class="text-bold">Permainan?</text>

  
  <rect x="345" y="253" width="75" height="20" class="label-bg" />
  <text x="382" y="267" class="label">Mod PvP</text>
  <rect x="680" y="253" width="75" height="20" class="label-bg" />
  <text x="717" y="267" class="label">Mod PvE</text>

  
  <polygon points="195,335 425,335 405,405 175,405" class="io" />
  <text x="300" y="360" class="text-bold">Masukkan Server IP Address</text>
  <text x="300" y="382" class="text-small">(Lalai: 127.0.0.1:8080)</text>

  
  <rect x="660" y="335" width="280" height="70" rx="8" ry="8" class="process" />
  <text x="800" y="360" class="text-bold">Sambung Server Tempatan</text>
  <text x="800" y="382" class="text-small">&amp; Aktifkan Lawan AI Sistem</text>

  
  <rect x="165" y="445" width="270" height="70" rx="8" ry="8" class="process" />
  <text x="300" y="470" class="text-bold">Client Godot Sambung ke</text>
  <text x="300" y="492" class="text-small">Server Node.js via WebSocket</text>

  
  <polygon points="300,555 395,615 300,675 205,615" class="decision" />
  <text x="300" y="607" class="text-bold">Sambungan &amp;</text>
  <text x="300" y="625" class="text-bold">2 Pemain Sedia?</text>

  <rect x="135" y="592" width="50" height="20" class="label-bg" />
  <text x="160" y="606" class="label">Tidak</text>
  <rect x="310" y="683" width="30" height="20" class="label-bg" />
  <text x="325" y="697" class="label">Ya</text>

  
  <rect x="400" y="745" width="300" height="70" rx="8" ry="8" class="server" />
  <text x="550" y="770" class="text-bold">Server Menetapkan Peranan Secara Rawak</text>
  <text x="550" y="792" class="text-small">(Hacker vs Target) &amp; Profil Sasaran</text>

  
  <rect x="415" y="855" width="270" height="50" rx="8" ry="8" class="process" />
  <text x="550" y="880" class="text-bold">Sesi Perlumbaan Objektif Bermula</text>

  
  <polygon points="550,945 650,1005 550,1065 450,1005" class="decision" />
  <text x="550" y="997" class="text-bold">Ada Pemain</text>
  <text x="550" y="1015" class="text-bold">Terputus?</text>

  <rect x="665" y="982" width="30" height="20" class="label-bg" />
  <text x="680" y="996" class="label">Ya</text>
  <rect x="560" y="1070" width="48" height="20" class="label-bg" />
  <text x="584" y="1084" class="label">Tidak</text>

  
  <rect x="815" y="1045" width="230" height="70" rx="8" ry="8" class="win" />
  <text x="930" y="1070" class="text-bold">Kemenangan Lalai</text>
  <text x="930" y="1092" class="text-small">Diberikan Kepada Pemain Aktif</text>

  
  <rect x="150" y="1135" width="340" height="140" rx="8" ry="8" class="hacker" />
  <text x="320" y="1156" class="text-bold" style="fill:#991b1b;">Peranan: Hacker (5 Fasa Serangan)</text>
  <text x="170" y="1182" class="text-left">1. Reconnaissance (Dossier Sasaran)</text>
  <text x="170" y="1202" class="text-left">2. Scanning (Imbasan Rangkaian/Sosial)</text>
  <text x="170" y="1222" class="text-left">3. Gaining Access (Modular Bait Builder)</text>
  <text x="170" y="1242" class="text-left">4. Maintaining Access (Fast/Slow Exfil)</text>
  <text x="170" y="1262" class="text-left">5. Covering Tracks (Padam Log &amp; Jejak)</text>

  
  <rect x="540" y="1135" width="360" height="140" rx="8" ry="8" class="target" />
  <text x="720" y="1156" class="text-bold" style="fill:#1e40af;">Peranan: Target (Pertahanan &amp; Tugas)</text>
  <text x="560" y="1184" class="text-left">• Selesaikan 3 Tugasan Harian Sah</text>
  <text x="560" y="1206" class="text-left">• Urus Notifikasi (Buka / Imbas / Sekat)</text>
  <text x="560" y="1228" class="text-left">• Guna Tool Keselamatan (Kuota: 2x)</text>
  <text x="560" y="1250" class="text-left">• Kawal Kesilapan (Had Maksimum: 3x)</text>

  
  <rect x="370" y="1325" width="360" height="60" rx="8" ry="8" class="server" />
  <text x="550" y="1346" class="text-bold">Server Autoritatif Mengesahkan Tindakan</text>
  <text x="550" y="1366" class="text-small">&amp; Mengemas Kini Status Aset / Tugasan (JSON)</text>

  
  <polygon points="550,1420 675,1485 550,1550 425,1485" class="decision" />
  <text x="550" y="1468" class="text-bold">Syarat Kemenangan</text>
  <text x="550" y="1486" class="text-bold">Tercapai?</text>
  <text x="550" y="1505" class="text-small">(3 Tugas / Lockdown / Exfil)</text>

  <rect x="240" y="1462" width="140" height="20" class="label-bg" />
  <text x="310" y="1476" class="label">Tidak (Terus Sesi)</text>
  <rect x="560" y="1555" width="30" height="20" class="label-bg" />
  <text x="575" y="1569" class="label">Ya</text>

  
  <rect x="405" y="1585" width="290" height="60" rx="8" ry="8" class="server" />
  <text x="550" y="1606" class="text-bold">Server Mengira Skor (0 – 1000)</text>
  <text x="550" y="1626" class="text-small">&amp; Menentukan Gred (S, A, B, C, F)</text>

  
  <polygon points="385,1685 735,1685 715,1745 365,1745" class="io" />
  <text x="550" y="1707" class="text-bold">Papar Skrin Keputusan, Skor, Gred</text>
  <text x="550" y="1727" class="text-small">&amp; Laporan Pasca-Perlawanan (Salin Laporan)</text>

  
  <rect x="440" y="1755" width="220" height="40" rx="6" ry="6" class="process" />
  <text x="550" y="1775" class="text-small">Main Semula / Menu Utama</text>

  <rect x="190" y="1752" width="110" height="20" class="label-bg" />
  <text x="245" y="1766" class="label">Main Semula</text>
  <rect x="675" y="1752" width="95" height="20" class="label-bg" />
  <text x="722" y="1766" class="label">Menu Utama</text>

  
  <rect x="700" y="1795" width="160" height="45" rx="22.5" ry="22.5" class="terminator" />
  <text x="780" y="1817.5" class="text-bold">TAMAT</text>

</svg>