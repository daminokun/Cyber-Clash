<path d="M700,190 L1130,280" stroke="#526581" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<rect x="390" y="570" width="620" height="100" rx="13" fill="#f3f5f8" stroke="#9aa8b8" stroke-width="2"/>
<text x="700.0" y="599" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172b4d">INTEGRASI SISTEM</text>
<text x="700.0" y="626" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b4d">Gabungkan modul Red Team, Blue Team, server dan sistem keputusan</text>
<path d="M270,470 L700,570" stroke="#526581" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<path d="M700,470 L700,570" stroke="#526581" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<path d="M1130,470 L700,570" stroke="#526581" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<rect x="390" y="735" width="620" height="90" rx="13" fill="#eaf2ff" stroke="#4b78c8" stroke-width="2"/>
<text x="700.0" y="764" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172b4d">PENGUJIAN &amp; PENILAIAN</text>
<text x="700.0" y="791" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b4d">Uji fungsi, komunikasi, objektif, skor dan kestabilan sesi</text>
<path d="M700,670 L700,735" stroke="#526581" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<rect x="1070" y="735" width="260" height="90" rx="13" fill="#e8f7f4" stroke="#25877a" stroke-width="2"/>
<text x="1200.0" y="764" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172b4d">DOKUMENTASI</text>
<text x="1200.0" y="791" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b4d">Laporan dan pembentangan</text>
<path d="M1010,780 L1070,780" stroke="#526581" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
