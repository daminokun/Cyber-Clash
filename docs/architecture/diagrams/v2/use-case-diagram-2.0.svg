<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" style="background:#090d16; font-family:'Segoe UI', Arial, sans-serif;">
  <text x="490" y="38" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="bold" letter-spacing="1">RAJAH KES PENGGUNAAN (USE CASE DIAGRAM — CYBER CLASH 2.0)</text>
  <text x="490" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Pemodelan Interaksi Antara Tiga Entiti: Hacker, Target, dan Pelayan Autoritatif</text>

