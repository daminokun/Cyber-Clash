  <line x1="60" y1="270" x2="120" y2="270" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="90" y1="300" x2="70" y2="340" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="90" y1="300" x2="110" y2="340" stroke="#ef4444" stroke-width="2.5"/>
  <text x="90" y="365" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="bold">HACKER</text>
  <text x="90" y="380" text-anchor="middle" fill="#94a3b8" font-size="10">(Red Team)</text>

  <!-- ACTOR 2: TARGET -->
  <circle cx="890" cy="230" r="22" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <line x1="890" y1="252" x2="890" y2="300" stroke="#3b82f6" stroke-width="2.5"/>
  <line x1="860" y1="270" x2="920" y2="270" stroke="#3b82f6" stroke-width="2.5"/>
  <line x1="890" y1="300" x2="870" y2="340" stroke="#3b82f6" stroke-width="2.5"/>
  <line x1="890" y1="300" x2="910" y2="340" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="890" y="365" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="bold">TARGET</text>
  <text x="890" y="380" text-anchor="middle" fill="#94a3b8" font-size="10">(Blue Team)</text>

  <!-- ACTOR 3: SERVER -->
  <rect x="420" y="495" width="140" height="30" rx="6" fill="#0284c7"/>
  <text x="490" y="515" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">&lt;&lt;Pelayan Autoritatif&gt;&gt;</text>

  <!-- USE CASES -->
  <!-- UC1 -->
  <ellipse cx="340" cy="150" rx="90" ry="22" fill="#1e293b" stroke="#ef4444"/>
  <text x="340" y="154" text-anchor="middle" fill="#e2e8f0" font-size="10">UC1: Semak Profil OSINT</text>
  <line x1="115" y1="240" x2="255" y2="160" stroke="#ef4444" stroke-width="1.2"/>

  <!-- UC2 -->
