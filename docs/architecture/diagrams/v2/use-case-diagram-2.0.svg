  <!-- UC6: Target -->
  <ellipse cx="640" cy="150" rx="95" ry="22" fill="#1e293b" stroke="#3b82f6"/>
  <text x="640" y="154" text-anchor="middle" fill="#e2e8f0" font-size="10">UC6: Siapkan 3 Tugasan Harian</text>
