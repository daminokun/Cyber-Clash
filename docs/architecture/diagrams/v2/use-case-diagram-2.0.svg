  <!-- SERVER AUTOMATIC USE CASES -->
  <ellipse cx="490" cy="445" rx="105" ry="22" fill="#0b1329" stroke="#0284c7"/>
  <text x="490" y="449" text-anchor="middle" fill="#38bdf8" font-size="10">UC11: Auto-Approval &amp; Scoring</text>
  <line x1="490" y1="467" x2="490" y2="495" stroke="#0284c7" stroke-width="1.5"/>
</svg>