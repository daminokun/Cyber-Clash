  <!-- UC9 -->
  <ellipse cx="640" cy="330" rx="95" ry="22" fill="#1e293b" stroke="#3b82f6"/>
  <text x="640" y="334" text-anchor="middle" fill="#e2e8f0" font-size="10">UC9: Sekat Emel Phishing (Block)</text>
