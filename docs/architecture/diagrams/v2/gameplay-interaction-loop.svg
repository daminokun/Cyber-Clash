<text x="270.0" y="686" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#172b4d">1. Reconnaissance  2. Scanning</text>
<text x="270.0" y="709" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#172b4d">3. Gaining Access</text>
<text x="270.0" y="732" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#172b4d">4. Maintaining Access &amp; Exfiltration</text>
<text x="270.0" y="755" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#172b4d">5. Covering Tracks</text>
<rect x="550" y="630" width="400" height="130" rx="13" fill="#f3f5f8" stroke="#9aa8b8" stroke-width="2"/>
<text x="750.0" y="659" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#172b4d">SERVER AUTORITATIF</text>
<text x="750.0" y="686" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#172b4d">Sahkan tindakan dan kemas kini state</text>
<text x="750.0" y="709" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#172b4d">Selaraskan masa, objektif dan keputusan</text>
<text x="750.0" y="732" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#172b4d">Urus disconnect / default win</text>
<rect x="1030" y="630" width="400" height="130" rx="13" fill="#e8f7f4" stroke="#25877a" stroke-width="2"/>
<text x="1230.0" y="659" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#172b4d">TARGET / BLUE TEAM</text>
<text x="1230.0" y="686" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#172b4d">Selesaikan 3 tugasan harian sah</text>
<text x="1230.0" y="709" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#172b4d">Buka / Imbas / Padam atau Block</text>
<text x="1230.0" y="732" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#172b4d">Isolate Network &amp; Report to Police</text>
