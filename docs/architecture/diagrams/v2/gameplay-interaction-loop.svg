<text x="750.0" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172b4d">PILIHAN PvE</text>
<text x="750.0" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b4d">Seorang pemain menentang sistem</text>
<text x="750.0" y="349" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b4d">Peranan lawan dikendalikan AI</text>
