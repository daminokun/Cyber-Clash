<text x="1220.0" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b4d">Sambung ke Server IP</text>
<text x="1220.0" y="349" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b4d">Lobi / sesi permainan</text>
