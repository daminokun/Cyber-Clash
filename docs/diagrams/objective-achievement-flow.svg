<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1660" viewBox="0 0 1200 1660">
  <title>Carta Alir Prosedur Mencapai Objektif Cyber Clash</title>
  <desc>Prosedur pembangunan Cyber Clash daripada analisis masalah sehingga dokumentasi dan pembentangan.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 21px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 500 18px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .line { stroke: #334155; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .process { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .objective { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; }
      .decision { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .terminal { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 3; }
      .yesno { font: 600 18px Arial, sans-serif; fill: #92400e; }
    </style>
  </defs>

  <rect width="1200" height="1660" fill="#ffffff"/>
  <text x="600" y="55" class="title" text-anchor="middle">CARTA ALIR PROSEDUR MENCAPAI OBJEKTIF</text>

  <rect x="430" y="90" width="340" height="70" rx="35" class="terminal"/>
  <text x="600" y="133" class="label">MULA</text>

  <rect x="330" y="210" width="540" height="85" rx="18" class="process"/>
  <text x="600" y="247" class="label">Kenal pasti masalah</text>
  <text x="600" y="275" class="small">pembelajaran keselamatan siber</text>

  <rect x="330" y="345" width="540" height="85" rx="18" class="process"/>
  <text x="600" y="382" class="label">Kaji keperluan pengguna</text>
  <text x="600" y="410" class="small">dan keperluan sistem</text>

  <rect x="330" y="480" width="540" height="85" rx="18" class="process"/>
  <text x="600" y="517" class="label">Reka bentuk permainan</text>
  <text x="600" y="545" class="small">dan senario keselamatan siber</text>

  <rect x="250" y="615" width="700" height="95" rx="18" class="objective"/>
  <text x="600" y="652" class="label">Bangunkan simulasi Red Team</text>
  <text x="600" y="681" class="label">dan Blue Team (Objektif 1)</text>

  <rect x="250" y="750" width="700" height="95" rx="18" class="objective"/>
  <text x="600" y="787" class="label">Bangunkan fungsi PvP</text>
  <text x="600" y="816" class="label">menggunakan client-server (Objektif 2)</text>

  <rect x="250" y="885" width="700" height="95" rx="18" class="objective"/>
  <text x="600" y="922" class="label">Bangunkan rekod tindakan, objektif,</text>
  <text x="600" y="951" class="label">skor dan keputusan (Objektif 3)</text>

  <rect x="330" y="1020" width="540" height="85" rx="18" class="process"/>
  <text x="600" y="1057" class="label">Integrasikan semua</text>
  <text x="600" y="1085" class="small">fungsi sistem</text>

  <rect x="330" y="1145" width="540" height="85" rx="18" class="process"/>
  <text x="600" y="1182" class="label">Jalankan pengujian</text>
  <text x="600" y="1210" class="small">sistem</text>

  <polygon points="600,1270 790,1360 600,1450 410,1360" class="decision"/>
  <text x="600" y="1352" class="label">Adakah semua</text>
  <text x="600" y="1380" class="label">objektif tercapai?</text>

  <rect x="330" y="1510" width="540" height="85" rx="18" class="terminal"/>
  <text x="600" y="1547" class="label">Dokumentasi dan</text>
  <text x="600" y="1575" class="label">pembentangan</text>

  <path d="M600 160 L600 210" class="line"/>
  <path d="M600 295 L600 345" class="line"/>
  <path d="M600 430 L600 480" class="line"/>
  <path d="M600 565 L600 615" class="line"/>
  <path d="M600 710 L600 750" class="line"/>
  <path d="M600 845 L600 885" class="line"/>
  <path d="M600 980 L600 1020" class="line"/>
  <path d="M600 1105 L600 1145" class="line"/>
  <path d="M600 1230 L600 1270" class="line"/>
  <path d="M600 1450 L600 1510" class="line"/>

  <path d="M410 1360 L145 1360 L145 1140 L330 1140" class="line"/>
  <text x="170" y="1335" class="yesno">Tidak</text>
  <text x="160" y="1115" class="small">Baiki dan bangunkan</text>
  <text x="160" y="1138" class="small">semula fungsi</text>

  <text x="625" y="1485" class="yesno">Ya</text>
</svg>
