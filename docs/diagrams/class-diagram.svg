<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
  <title>UML Class Diagram Cyber Clash</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      .title{font:700 32px Arial;fill:#0f172a}.head{font:700 21px Arial;fill:#0f172a;text-anchor:middle}.text{font:500 17px Arial;fill:#334155;text-anchor:middle}.box{fill:#f8fafc;stroke:#334155;stroke-width:3}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="1050" fill="#fff"/><text x="750" y="50" class="title" text-anchor="middle">UML CLASS DIAGRAM</text>
  <g transform="translate(70 130)"><rect width="270" height="240" class="box"/><line x1="0" y1="50" x2="270" y2="50" stroke="#334155" stroke-width="2"/><line x1="0" y1="135" x2="270" y2="135" stroke="#334155" stroke-width="2"/><text x="135" y="33" class="head">Client</text><text x="135" y="80" class="text">+ connect()</text><text x="135" y="107" class="text">+ sendAction()</text><text x="135" y="165" class="text">+ displayState()</text><text x="135" y="192" class="text">+ displayResult()</text></g>
  <g transform="translate(615 100)"><rect width="300" height="300" class="box"/><line x1="0" y1="55" x2="300" y2="55" stroke="#334155" stroke-width="2"/><line x1="0" y1="170" x2="300" y2="170" stroke="#334155" stroke-width="2"/><text x="150" y="35" class="head">GameServer</text><text x="150" y="87" class="text">+ createLobby()</text><text x="150" y="114" class="text">+ joinLobby()</text><text x="150" y="141" class="text">+ validateAction()</text><text x="150" y="200" class="text">+ resolveScenario()</text><text x="150" y="227" class="text">+ updateScore()</text><text x="150" y="254" class="text">+ sendView()</text></g>
  <g transform="translate(1130 130)"><rect width="270" height="240" class="box"/><line x1="0" y1="50" x2="270" y2="50" stroke="#334155" stroke-width="2"/><line x1="0" y1="135" x2="270" y2="135" stroke="#334155" stroke-width="2"/><text x="135" y="33" class="head">Lobby</text><text x="135" y="80" class="text">+ lobbyId</text><text x="135" y="107" class="text">+ players</text><text x="135" y="165" class="text">+ status</text><text x="135" y="192" class="text">+ addPlayer()</text></g>
  <g transform="translate(70 600)"><rect width="300" height="260" class="box"/><line x1="0" y1="55" x2="300" y2="55" stroke="#334155" stroke-width="2"/><line x1="0" y1="145" x2="300" y2="145" stroke="#334155" stroke-width="2"/><text x="150" y="35" class="head">Match</text><text x="150" y="87" class="text">+ roundNumber</text><text x="150" y="114" class="text">+ score</text><text x="150" y="175" class="text">+ startRound()</text><text x="150" y="202" class="text">+ nextRound()</text><text x="150" y="229" class="text">+ completeMatch()</text></g>
  <g transform="translate(600 590)"><rect width="300" height="280" class="box"/><line x1="0" y1="55" x2="300" y2="55" stroke="#334155" stroke-width="2"/><line x1="0" y1="145" x2="300" y2="145" stroke="#334155" stroke-width="2"/><text x="150" y="35" class="head">ScenarioRegistry</text><text x="150" y="87" class="text">+ create()</text><text x="150" y="114" class="text">+ apply()</text><text x="150" y="175" class="text">+ view()</text><text x="150" y="202" class="text">+ resolve()</text><text x="150" y="229" class="text">+ listScenarios()</text></g>
  <g transform="translate(1130 600)"><rect width="270" height="260" class="box"/><line x1="0" y1="50" x2="270" y2="50" stroke="#334155" stroke-width="2"/><line x1="0" y1="135" x2="270" y2="135" stroke="#334155" stroke-width="2"/><text x="135" y="33" class="head">ScoreManager</text><text x="135" y="80" class="text">+ redScore</text><text x="135" y="107" class="text">+ blueScore</text><text x="135" y="165" class="text">+ calculateScore()</text><text x="135" y="192" class="text">+ updateScore()</text></g>
  <path d="M340 250H615" class="line"/><path d="M915 250H1130" class="line"/><path d="M765 400V590" class="line"/><path d="M615 730H370" class="line"/><path d="M900 730H1130" class="line"/>
  <text x="475" y="235" class="text">uses</text><text x="1020" y="235" class="text">manages</text><text x="790" y="500" class="text">contains</text><text x="485" y="715" class="text">creates</text><text x="1015" y="715" class="text">updates</text>
</svg>
