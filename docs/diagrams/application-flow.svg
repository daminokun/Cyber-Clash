<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1650" viewBox="0 0 1200 1650">
  <title>Carta Alir Aplikasi Cyber Clash</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      .title{font:700 30px Arial;fill:#0f172a}.text{font:600 19px Arial;fill:#0f172a;text-anchor:middle}.sub{font:400 16px Arial;fill:#334155;text-anchor:middle}.box{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.decision{fill:#fef3c7;stroke:#d97706;stroke-width:3}.end{fill:#e0e7ff;stroke:#4f46e5;stroke-width:3}.line{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#arrow)}.yn{font:600 17px Arial;fill:#92400e}
    </style>
  </defs>
  <rect width="1200" height="1650" fill="#fff"/>
  <text x="600" y="52" class="title" text-anchor="middle">CARTA ALIR APLIKASI CYBER CLASH</text>
  <rect x="425" y="80" width="350" height="65" rx="32" class="end"/><text x="600" y="121" class="text">Mula</text>
  <rect x="325" y="180" width="550" height="78" rx="16" class="box"/><text x="600" y="214" class="text">Pemain menyertai lobby</text><text x="600" y="239" class="sub">host, match atau auto</text>
  <rect x="325" y="293" width="550" height="78" rx="16" class="box"/><text x="600" y="327" class="text">Server menunggu dua pemain</text><text x="600" y="352" class="sub">dan menetapkan peranan</text>
  <rect x="325" y="406" width="550" height="78" rx="16" class="box"/><text x="600" y="440" class="text">Server menjana senario</text><text x="600" y="465" class="sub">tiga senario unik bagi perlawanan</text>
  <rect x="325" y="519" width="550" height="78" rx="16" class="box"/><text x="600" y="553" class="text">Red Team memilih tindakan</text><text x="600" y="578" class="sub">serang atau Do Nothing</text>
  <rect x="325" y="632" width="550" height="78" rx="16" class="box"/><text x="600" y="666" class="text">Blue Team menerima maklumat</text><text x="600" y="691" class="sub">berdasarkan paparan yang dibenarkan</text>
  <rect x="325" y="745" width="550" height="78" rx="16" class="box"/><text x="600" y="779" class="text">Blue Team menjalankan siasatan</text><text x="600" y="804" class="sub">untuk mendapatkan bukti tambahan</text>
  <rect x="325" y="858" width="550" height="78" rx="16" class="box"/><text x="600" y="892" class="text">Blue Team memilih pertahanan</text><text x="600" y="917" class="sub">report, ignore, block atau tindakan khusus</text>
  <rect x="325" y="971" width="550" height="78" rx="16" class="box"/><text x="600" y="1005" class="text">Server menentukan keputusan</text><text x="600" y="1030" class="sub">dan mengemas kini skor</text>
  <polygon points="600,1090 790,1180 600,1270 410,1180" class="decision"/><text x="600" y="1172" class="text">Adakah tiga pusingan</text><text x="600" y="1200" class="text">telah selesai?</text>
  <rect x="425" y="1350" width="350" height="65" rx="32" class="end"/><text x="600" y="1391" class="text">Papar keputusan</text>
  <path d="M600 145V180M600 258V293M600 371V406M600 484V519M600 597V632M600 710V745M600 823V858M600 936V971M600 1049V1090M600 1270V1350" class="line"/>
  <path d="M410 1180H140V445H325" class="line"/>
  <text x="805" y="1310" class="yn">Ya</text><text x="160" y="425" class="yn">Tidak: senario seterusnya</text>
</svg>
