<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="1020" height="540" style="background:#090d16; font-family:'Segoe UI', Arial, sans-serif;">
  <text x="510" y="38" text-anchor="middle" fill="#eab308" font-size="20" font-weight="bold" letter-spacing="1">MODUL PENJANAAN SENARIO &amp; 4 ARKETIP SASARAN</text>
  <text x="510" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Penyelaras: TARRSINY VIDYASSHRI A/P SHINGARA VADIVEL (Scenario Generation &amp; Objective System)</text>

  <!-- CENTRAL GENERATOR ENGINE -->
