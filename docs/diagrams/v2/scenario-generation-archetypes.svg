  <text x="510" y="168" text-anchor="middle" fill="#94a3b8" font-size="9">Input: Rawak Lobi ➔ Output: Dossier OSINT &amp; Beban Kerja</text>

  <!-- CONNECTING ARROWS FROM ENGINE TO 4 ARCHETYPES -->
  <!-- Line to Archetype 1 -->
  <path d="M 410 180 L 410 215 L 140 215 L 140 240" fill="none" stroke="#eab308" stroke-width="2"/>
  <polygon points="140,240 135,232 145,232" fill="#eab308"/>

  <!-- Line to Archetype 2 -->
  <path d="M 470 180 L 470 215 L 390 215 L 390 240" fill="none" stroke="#eab308" stroke-width="2"/>
