<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" style="background:#090d16; font-family:'Segoe UI', Consolas, sans-serif;">
  <text x="490" y="38" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="bold" letter-spacing="1">RAJAH KELAS &amp; STRUKTUR DATA (CLASS DIAGRAM — CYBER CLASH 2.0)</text>
  <text x="490" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Pemodelan Struktur Berorientasikan Objek pada Pelayan Node.js &amp; Klien Godot Engine</text>

  <!-- Class: MatchSession -->
  <rect x="30" y="90" width="280" height="230" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="30" y="90" width="280" height="32" rx="6" fill="#0284c7"/>
  <text x="170" y="112" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">MatchSession</text>
  <text x="45" y="140" fill="#cbd5e1" font-size="11">+ matchId: String</text>
  <text x="45" y="157" fill="#cbd5e1" font-size="11">+ state: GameState (5-Phases)</text>
  <text x="45" y="174" fill="#cbd5e1" font-size="11">+ exfilProgress: Float [0..100]</text>
  <text x="45" y="191" fill="#cbd5e1" font-size="11">+ alarmCountdown: Int (10..20s)</text>
  <text x="45" y="208" fill="#cbd5e1" font-size="11">+ complianceTimer: Int</text>
  <line x1="30" y1="218" x2="310" y2="218" stroke="#334155" stroke-width="1.5"/>
  <text x="45" y="236" fill="#fca5a5" font-size="11">+ processAttack(payload)</text>
  <text x="45" y="253" fill="#fca5a5" font-size="11">+ triggerEmergencyAlarm()</text>
  <text x="45" y="270" fill="#fca5a5" font-size="11">+ checkVictoryConditions()</text>
  <text x="45" y="287" fill="#fca5a5" font-size="11">+ handleDisconnect(socket)</text>

  <!-- Class: TargetProfile -->
  <rect x="360" y="90" width="280" height="230" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="360" y="90" width="280" height="32" rx="6" fill="#2563eb"/>
  <text x="500" y="112" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">TargetProfile</text>
  <text x="375" y="140" fill="#cbd5e1" font-size="11">+ archetype: ArchetypeEnum</text>
  <text x="375" y="157" fill="#cbd5e1" font-size="11">+ targetName: String</text>
  <text x="375" y="174" fill="#cbd5e1" font-size="11">+ assetBalance: Double</text>
  <text x="375" y="191" fill="#cbd5e1" font-size="11">+ dailyTasks: List&lt;DailyTask&gt; (3)</text>
  <text x="375" y="208" fill="#cbd5e1" font-size="11">+ toolQuota: Map&lt;Tool, Int&gt; (2x)</text>
  <text x="375" y="225" fill="#cbd5e1" font-size="11">+ falseNegativeStrikes: Int (3x)</text>
  <line x1="360" y1="235" x2="640" y2="235" stroke="#334155" stroke-width="1.5"/>
  <text x="375" y="253" fill="#93c5fd" font-size="11">+ verifyEmail(emailId)</text>
  <text x="375" y="270" fill="#93c5fd" font-size="11">+ executeToolScan(toolType)</text>
  <text x="375" y="287" fill="#93c5fd" font-size="11">+ isolateNetwork()</text>

  <!-- Class: AttackPayload -->
  <rect x="680" y="90" width="270" height="200" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <rect x="680" y="90" width="270" height="32" rx="6" fill="#dc2626"/>
  <text x="815" y="112" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">AttackPayload</text>
  <text x="695" y="140" fill="#cbd5e1" font-size="11">+ vector: AttackVectorEnum</text>
  <text x="695" y="157" fill="#cbd5e1" font-size="11">+ spoofedSender: String</text>
  <text x="695" y="174" fill="#cbd5e1" font-size="11">+ topicSubject: String</text>
  <text x="695" y="191" fill="#cbd5e1" font-size="11">+ trapType: TrapEnum (Link/Doc)</text>
  <text x="695" y="208" fill="#cbd5e1" font-size="11">+ exfilMode: SpeedEnum (Fast/Slow)</text>
  <line x1="680" y1="218" x2="950" y2="218" stroke="#334155" stroke-width="1.5"/>
  <text x="695" y="236" fill="#fca5a5" font-size="11">+ generateBaitPayload()</text>
  <text x="695" y="253" fill="#fca5a5" font-size="11">+ validateTypoSquatting()</text>

  <!-- Class: DailyTask -->
  <rect x="200" y="360" width="260" height="150" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
  <rect x="200" y="360" width="260" height="30" rx="6" fill="#ca8a04"/>
  <text x="330" y="381" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">DailyTask</text>
  <text x="215" y="405" fill="#cbd5e1" font-size="11">+ taskId: Int [1..3]</text>
  <text x="215" y="422" fill="#cbd5e1" font-size="11">+ taskType: TaskEnum (Emel/Doc)</text>
  <text x="215" y="439" fill="#cbd5e1" font-size="11">+ isCompleted: Boolean</text>
  <text x="215" y="456" fill="#cbd5e1" font-size="11">+ complianceDeadline: Int</text>
  <line x1="200" y1="466" x2="460" y2="466" stroke="#334155" stroke-width="1.5"/>
  <text x="215" y="484" fill="#fde047" font-size="11">+ markCompleted()</text>
  <text x="215" y="500" fill="#fde047" font-size="11">+ triggerAutoApproval()</text>

  <!-- Class: ScoringEngine -->
  <rect x="520" y="360" width="280" height="150" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <rect x="520" y="360" width="280" height="30" rx="6" fill="#16a34a"/>
  <text x="660" y="381" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">ScoringEngine</text>
  <text x="535" y="405" fill="#cbd5e1" font-size="11">+ hackerScore: Int [0..1000]</text>
  <text x="535" y="422" fill="#cbd5e1" font-size="11">+ targetScore: Int [0..1000]</text>
  <text x="535" y="439" fill="#cbd5e1" font-size="11">+ assignedGrade: GradeEnum (S/A/B/C/F)</text>
  <line x1="520" y1="449" x2="800" y2="449" stroke="#334155" stroke-width="1.5"/>
  <text x="535" y="468" fill="#86efac" font-size="11">+ calculateHackerGrade()</text>
  <text x="535" y="485" fill="#86efac" font-size="11">+ generatePostMortemReport()</text>

  <!-- ASSOCIATIONS -->
  <line x1="310" y1="180" x2="360" y2="180" stroke="#38bdf8" stroke-width="2"/>
  <text x="335" y="172" text-anchor="middle" fill="#94a3b8" font-size="10">1 : 1</text>

  <line x1="640" y1="180" x2="680" y2="180" stroke="#38bdf8" stroke-width="2"/>
  <text x="660" y="172" text-anchor="middle" fill="#94a3b8" font-size="10">1 : *</text>

  <line x1="430" y1="320" x2="430" y2="360" stroke="#3b82f6" stroke-width="2"/>
  <text x="445" y="345" fill="#94a3b8" font-size="10">1 : 3</text>

  <line x1="570" y1="320" x2="570" y2="360" stroke="#22c55e" stroke-width="2"/>
  <text x="585" y="345" fill="#94a3b8" font-size="10">1 : 1</text>
</svg>