    <style>
      .title{font:700 32px Arial;fill:#0f172a}.head{font:700 22px Arial;fill:#0f172a;text-anchor:middle}.text{font:500 18px Arial;fill:#0f172a;text-anchor:middle}.box{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.server{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.lane{stroke:#94a3b8;stroke-width:2}
    </style>
  </defs>
  <rect width="1300" height="1200" fill="#fff"/><text x="650" y="48" class="title" text-anchor="middle">ACTIVITY DIAGRAM PERMAINAN</text>
